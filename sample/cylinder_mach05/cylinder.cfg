%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 demo case: 2D subsonic flow (M = 0.5) over a circular cylinder          %
% in a channel. Laminar Navier-Stokes, Re_D = 40 (steady twin-vortex regime). %
% Domain: x in [-5, 15], y in [-3, 3], D = 1.                                 %
%                                                                              %
% Markers (from Gmsh physical groups):                                        %
%   inlet      -> subsonic inflow (total T/P + direction)                     %
%   outlet     -> static back pressure                                        %
%   freestream -> Riemann-invariant freestream (top/bottom)                   %
%   cylinder   -> no-slip adiabatic wall                                      %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ----------------------------- solver definition ---------------------------
SOLVER= NAVIER_STOKES
KIND_TURB_MODEL= NONE
TIME_DOMAIN= NO

% --------------------------- freestream conditions -------------------------
MACH_NUMBER= 0.5
AOA= 0.0
SIDESLIP_ANGLE= 0.0

% Thermodynamic freestream state, scaled so that Re_D = 40:
%   T_inf = 288.15 K, a_inf = sqrt(g R T) = 340.30 m/s, U_inf = 170.15 m/s
%   mu_inf = Sutherland(288.15 K) = 1.7895e-5
%   rho_inf = Re * mu / (U * D) = 4.2069e-6 kg/m^3
%   P_inf = rho R T = 0.34797 Pa
%   T0 = T_inf * (1 + 0.2 M^2) = 302.5575 K
%   P0 = P_inf * (1 + 0.2 M^2)^3.5 = 0.41277 Pa
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 0.34797
REYNOLDS_NUMBER= 40.0
REYNOLDS_LENGTH= 1.0
GAS_CONSTANT= 287.058
GAMMA_VALUE= 1.4
VISCOSITY_MODEL= SUTHERLAND
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL

% ------------------------------ boundary markers ---------------------------
MARKER_INLET= ( inlet, 302.5575, 0.41277, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, 0.34797 )
MARKER_FAR= ( freestream )
MARKER_HEATFLUX= ( cylinder, 0.0 )
MARKER_MONITORING= ( cylinder )

% ------------------------------- numerics ----------------------------------
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
TIME_DISCRE_FLOW= EULER_IMPLICIT

CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 1.5, 100.0, 1e10 )

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-6
LINEAR_SOLVER_ITER= 50

% ----------------------------- convergence ---------------------------------
ITER= 1500
CONV_FIELD= ( RMS_DENSITY, RMS_MOMENTUM_X, RMS_MOMENTUM_Y, RMS_ENERGY )
CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 50

% -------------------------------- output -----------------------------------
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_PARAVIEW, PARAVIEW_LEGACY, SURFACE_PARAVIEW_LEGACY)
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_MOMENTUM_X, RMS_MOMENTUM_Y, RMS_ENERGY, DRAG, LIFT)
HISTORY_OUTPUT= ITER, RMS_RES, DRAG, LIFT
