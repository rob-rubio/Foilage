%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%  SU2 steady cascade/external-airfoil case - rendered by render_config.py
%  Cascade cases use total-condition inlet, static-pressure outlet, and
%  translational-periodic marker pair(s).  Freestream cases map every outer
%  mesh marker to MARKER_FAR.
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ----------------------------- solver definition ---------------------------
SOLVER= @SOLVER@
@TURB_MODEL_LINE@
TIME_DOMAIN= NO

% --------------------------- freestream / initialization -------------------
% TD_CONDITIONS initializes the uniform state.  In freestream mode,
% MACH_NUMBER is also the physical farfield Mach number, so the renderer uses
% the reduced startup Mach only for cascade cases.
MACH_NUMBER= @FLOW_MACH@
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= @INIT_TEMPERATURE@
FREESTREAM_PRESSURE= @INIT_PRESSURE@
REYNOLDS_NUMBER= @REYNOLDS@
REYNOLDS_LENGTH= @REYNOLDS_LENGTH@
GAS_CONSTANT= @GAS_CONSTANT@
GAMMA_VALUE= @GAMMA@
VISCOSITY_MODEL= SUTHERLAND
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
% Force-coefficient reference area: set only for 3D wedge cases so CD/CL
% stay planform-scaled (chord x span) like the 2D per-unit-depth values.
@REF_AREA_LINE@

% ------------------------------ boundary markers ---------------------------
MESH_FILENAME= @MESH_FILE@

% ------------------------- restart / warm-start files ----------------------
% SU2 v8 defaults both restart-input filenames to "solution.dat", but the
% RESTART output of a solved case is written to "restart.dat". Pin them so
% 'Initialize from previous solution' (RESTART_SOL= YES, patched by the
% GUI) finds the file the previous solve actually wrote.
RESTART_FILENAME= restart.dat
SOLUTION_FILENAME= restart.dat
@CASCADE_MARKER_LINES@

% ------------------------------- numerics ----------------------------------
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= @LIMITER@
NUM_METHOD_GRAD= @GRADIENT@
TIME_DISCRE_FLOW= EULER_IMPLICIT

CFL_NUMBER= @CFL@
@CFL_ADAPT_BLOCK@

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-6
LINEAR_SOLVER_ITER= @LINEAR_SOLVER_ITER@

% ----------------------------- convergence ---------------------------------
@ITER_LINE@
CONV_FIELD= ( @CONV_FIELDS@ )
CONV_RESIDUAL_MINVAL= @CONV_MINVAL@
CONV_STARTITER= @CONV_STARTITER@

% -------------------------------- output -----------------------------------
OUTPUT_FILES= ( @OUTPUT_FILES@ )
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_MOMENTUM_X, RMS_MOMENTUM_Y, RMS_ENERGY, DRAG, LIFT)
% FLOW_COEFF_SURF: per-surface history columns Avg_*(inlet) / Avg_*(outlet),
% used by the GUI live mass-flow and domain-imbalance plots
HISTORY_OUTPUT= ITER, RMS_RES, DRAG, LIFT, FLOW_COEFF_SURF@EXTRA_HISTORY@
